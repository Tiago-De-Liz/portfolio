server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Assets do Vite vêm com hash no nome — cache longo é seguro.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Os três Content-Type que o vercel.json forçava. O nginx acerta o de
    # robots.txt e sitemap.xml sozinho, mas o de manifest.json não — e o
    # X-Robots-Tag do sitemap era explícito, então fica explícito aqui também.
    location = /sitemap.xml {
        types { } default_type application/xml;
        add_header X-Robots-Tag "all";
        expires 1h;
    }

    location = /robots.txt {
        types { } default_type text/plain;
        expires 1h;
    }

    location = /manifest.json {
        types { } default_type application/manifest+json;
        expires 1h;
    }

    # Verificação de propriedade do Google Search Console: basta o arquivo
    # google<token>.html existir em public/.
    location ~ ^/google[0-9a-f]+\.html$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
